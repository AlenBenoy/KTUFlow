plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':ktu-core')

    // FlatLaf — modern flat look for Swing
    implementation 'com.formdev:flatlaf:3.4.1'
    implementation 'com.formdev:flatlaf-extras:3.4.1'

    // Quartz for scheduled notifications / reminders
    implementation 'org.quartz-scheduler:quartz:2.3.2'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.ktu.scholar.desktop.Main'
    }
}

shadowJar {
    archiveBaseName.set('ktu-desktop')
    archiveClassifier.set('')
    archiveVersion.set('')
}
