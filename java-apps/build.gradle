// Root build file — shared config for all subprojects
plugins {
    id 'java' 
    id 'com.gradleup.shadow' version '9.6.1' apply false 
}

allprojects {
    group = 'com.ktu.scholar'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }
}
